# GUTTS outreach engine settings. Edit this file to change what gets searched. No passwords or keys go in here.
locations: ["Fairfax, VA", "Washington, DC", "Ashburn, VA", "Manassas, VA", "Rockville, MD"]

# Roles a 72-hour pre-apprenticeship grad (EPA 608, OSHA, own tool bag) can realistically land, entry first.
search_terms:
  - HVAC helper
  - HVAC apprentice
  - HVAC installer
  - HVAC technician
  - plumber helper
  - plumbing apprentice
  - plumber
  - maintenance technician
  - building engineer
  - facilities technician
  - data center technician
usajobs_terms: ["HVAC", "plumber", "maintenance mechanic"]

jobspy_sites: [indeed, zip_recruiter]   # open-source JobSpy. Google Jobs is unavailable in JobSpy right now.
results_per_search: 60

# iHireConstruction search pages to read (title-state-city pattern from their site). Add or remove pages freely.
ihire_pages:
  - https://www.ihireconstruction.com/t-hvac-mechanic-s-virginia-c-fairfax-jobs.html
  - https://www.ihireconstruction.com/t-hvac-mechanic-s-maryland-c-rockville-jobs.html
  - https://www.ihireconstruction.com/t-hvac-mechanic-s-district-of-columbia-c-washington-jobs.html
  - https://www.ihireconstruction.com/t-plumber-s-virginia-c-fairfax-jobs.html
ihire_max_jobs: 80
max_days_old: 14
distance_miles: 25              # search radius around each location
levels: [Entry, Mid]            # Senior roles are dropped
only_new_companies: true        # skip companies already on a past sheet (master.csv)
max_companies: 150
workers: 8                      # companies crawled at the same time
delay_seconds: 1.0              # pause between pages on the same website

title_include: "hvac|plumb|pipe ?fitt|refriger|chiller|boiler|maintenance (tech|mech|engineer)|building (engineer|maintenance)|facilit(y|ies) (tech|engineer|maintenance)|critical (facilit|environment)|data cent(er|re) (tech|facilit|oper|engineer)|apprentice|mechanic(al)? (helper|tech)|service tech|installer|stationary engineer"
title_exclude: "software|sales|account|market|nurse|driver|cdl|electric(al|ian) (only|engineer)|design engineer|estimator|project manager|director|vp|vice president|recruit|intern\\b|customer service|dispatcher|warehouse|aircraft|aviation|automotive|auto tech|network|material handling|production|manufactur|industrial|electrical mechanical|fleet|security officer|trash|compactor|janitor|housekeep|cook|IT support"
area_regex: "\\b(VA|MD|DC|Virginia|Maryland|District of Columbia|Washington)\\b"

# Employer hiring boards list every city the company hires in. Only these DC-metro towns are kept from them.
metro_towns: [Washington, Fairfax, Arlington, Alexandria, Reston, Herndon, Sterling, Ashburn, Leesburg, Manassas, Chantilly,
  Centreville, Vienna, McLean, Mc Lean, Tysons, Falls Church, Springfield, Woodbridge, Lorton, Dulles, Gainesville, Annandale,
  Burke, Oakton, Merrifield, Dumfries, Haymarket, Rockville, Bethesda, Silver Spring, Gaithersburg, Germantown, Laurel,
  College Park, Bowie, Landover, Hyattsville, Greenbelt, Beltsville, Potomac, Wheaton, Olney, Waldorf, Upper Marlboro, Largo]

skip_companies: ["Confidential", "Indeed", "CyberCoders", "Aerotek", "Insight Global", "Robert Half", "TEKsystems", "Randstad", "Adecco", "Kelly Services", "Jobot", "Actalent", "Tradesmen International",
  "Cardinal Plumbing"]   # names here are removed from every sheet (matches any company containing the text)

discover_workday: false   # true = also read employers' Workday boards (slow: adds ~25 min, most calls get refused)

# Public career boards of local employers (free, always live). Add more as you find them.
ats_boards:
  - {company: Seatown, type: greenhouse, token: seatown}
  - {company: LightEdge, type: lever, token: lightedge}
  - {company: Novo, type: workable, token: novo}

